services:
  - type: web
    name: massive-master
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MM_ACTIVE_BACKEND
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: MM_OPENAI_BASE_URL
        value: https://api.openai.com/v1/chat/completions
      - key: WEB_CONCURRENCY
        value: "1"
